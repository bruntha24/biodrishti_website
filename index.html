<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>BioDrishti | Research Mentorship Platform</title>

    <meta
      name="description"
      content="BioDrishti is a research mentorship platform helping life sciences students with research guidance, study design, publication readiness, and scientific mentorship."
    />

    <meta name="theme-color" content="#0D1B2A" />

    <!-- Performance: DNS preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload logo -->
    <link
      rel="preload"
      as="image"
      href="/biodrishti_logo.webp"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="BioDrishti | Research Mentorship Platform" />

    <meta
      property="og:description"
      content="Research mentorship platform for life sciences students."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="/biodrishti_logo.webp"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="BioDrishti | Research Mentorship Platform"
    />

    <meta
      name="twitter:description"
      content="Research mentorship platform for life sciences students."
    />

    <meta
      name="twitter:image"
      content="/biodrishti_logo.webp"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/biodrishti_logo.webp"
      type="image/webp"
    />

    <!-- Prevent font layout shift -->
    <link
      rel="preload"
      href="/src/assets/fonts/dm-serif-display-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
